<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meus Produtos</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <h2>Cadastrar Produto</h2>
    <form id="formulario">
        <input type="text" id="nome" placeholder="Nome" required>
        <input type="number" id="preco" placeholder="Preço" required>
        <input type="text" id="descricao" placeholder="Descrição" required>
        <button type="submit">Salvar</button>
    </form>

    <h2>Buscar Produto por ID</h2>
    <form id="formulario-busca">
        <input type="number" id="busca-id" placeholder="ID do produto" required>
        <button type="submit">Buscar</button>
    </form>
    <div id="resultado-busca"></div>

    <h2>Lista de Produtos</h2>
    <!-- É aqui dentro que o JavaScript vai jogar os produtos -->
    <div id="lista-produtos"></div>

    

    <script src="script.js"></script>
</body>
</html>
